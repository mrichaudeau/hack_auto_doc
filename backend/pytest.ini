[pytest]
# Django settings module for tests
DJANGO_SETTINGS_MODULE = veille_tech.settings.test

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers for categorization
markers =
    integration: Integration tests requiring running services (Redis, worker)
    unit: Unit tests (isolated, fast, no external dependencies)
    slow: Tests that take more than 5 seconds to complete

# Pytest execution options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --reuse-db
    -ra
    --showlocals

# Test discovery path
testpaths = tests

# Coverage configuration
# Run with: pytest --cov=veille_tech --cov-report=html --cov-report=term
[coverage:run]
source = veille_tech
omit =
    */migrations/*
    */tests/*
    */settings/*
    */__pycache__/*
    */static/*
    */templates/*

[coverage:report]
# Fail if coverage falls below 80%
fail_under = 80
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
