services:
  # PostgreSQL database with pgvector extension
  db:
    image: pgvector/pgvector:pg15
    container_name: veille_tech_db
    restart: unless-stopped
    env_file:
      - .env.backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veille_tech_user} -d ${POSTGRES_DB:-veille_tech_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Redis for Celery broker and caching
  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "description=Redis broker and cache service - DB 0: Celery broker, DB 1: Application cache"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Django backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - .env.backend
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    command: python manage.py runserver 0.0.0.0:8000

  # React frontend SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    env_file:
      - .env.frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - app-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    labels:
      - "description=React frontend SPA with Vite - Hot module replacement enabled"
    command: npm run dev -- --host 0.0.0.0

  # Celery worker for AI pipeline tasks
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worker
    restart: unless-stopped
    env_file:
      - .env.backend
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    labels:
      - "description=Celery worker for AI pipeline - Processes content collection, synthesis, and embeddings"
    command: poetry run celery -A veille_tech worker --loglevel=info --watchdog --concurrency=${CELERY_WORKER_CONCURRENCY:-4}

  # Celery Beat scheduler for recurring tasks
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scheduler
    restart: unless-stopped
    env_file:
      - .env.backend
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    labels:
      - "description=Celery Beat scheduler - Manages recurring AI pipeline tasks"
    command: poetry run celery -A veille_tech beat --loglevel=info

volumes:
  # Named volume for PostgreSQL data persistence
  # Stores all database tables, indexes, and configuration
  # Supports up to 10GB of development data
  postgres_data:
    name: veille_tech_postgres_data
    driver: local

  # Named volume for Redis data persistence
  redis_data:
    name: veille_tech_redis_data
    driver: local

  # Named volume for frontend node_modules
  # Critical performance optimization for Windows/macOS Docker Desktop
  # Prevents slow file I/O on bind-mounted node_modules
  frontend_node_modules:
    name: frontend_node_modules
    driver: local

networks:
  # Internal network for service communication
  app-network:
    driver: bridge
